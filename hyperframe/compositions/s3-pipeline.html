      });

      // highlight windows (active node pops, others dim)
      function active(n, a, b) {
        var id = "#s3-n" + n;
        tl.to(id, { borderColor: "#ff7a59", boxShadow: "0 0 70px rgba(255,122,89,0.32)", backgroundColor: "#241b16", scale: 1.025, duration: 0.35, ease: "power2.out" }, a);
